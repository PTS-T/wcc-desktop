name: wcc-desktop
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Run python3 scripts/setup.py}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Run python3 scripts/setup.py}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
  auth:
    build:
      context: .
      dockerfile: wcc/auth/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_USER: ${MONGO_USER:?Run setup}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?Run setup}
      WCC_SESSION_SECRET: ${WCC_SESSION_SECRET:?Run setup}
      WCC_ADMIN_USER: ${WCC_ADMIN_USER:?Run setup}
      WCC_ADMIN_PASSWORD: ${WCC_ADMIN_PASSWORD:?Run setup}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - wcc-state:/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  desktop:
    build: ./desktop
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Bangkok}
      SUBFOLDER: /desktop/
      WCC_PUBLIC_PREFIX: /mawcc
      TITLE: WCC Desktop
    volumes:
      - desktop-home:/config
      - desktop-secret:/wcc-secret
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
    depends_on:
      auth:
        condition: service_healthy
      desktop:
        condition: service_started
    volumes:
      - wcc-state:/data:ro
      - gateway-tls:/etc/wcc/tls
volumes:
  mongo-data:
  wcc-state:
  desktop-home:
  desktop-secret:
  gateway-tls:
