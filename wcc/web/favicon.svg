<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#7c3aed"/>
  <!-- antenna -->
  <line x1="32" y1="9" x2="32" y2="16" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="8" r="3" fill="#e9d5ff"/>
  <!-- robot head -->
  <rect x="14" y="16" width="36" height="30" rx="8" fill="#f5f3ff"/>
  <!-- eyes -->
  <circle cx="25" cy="30" r="4.5" fill="#7c3aed"/>
  <circle cx="39" cy="30" r="4.5" fill="#7c3aed"/>
  <circle cx="26.5" cy="28.5" r="1.5" fill="#ffffff"/>
  <circle cx="40.5" cy="28.5" r="1.5" fill="#ffffff"/>
  <!-- mouth -->
  <rect x="24" y="38" width="16" height="3.5" rx="1.75" fill="#a78bfa"/>
  <!-- ears -->
  <rect x="9" y="26" width="4" height="10" rx="2" fill="#e9d5ff"/>
  <rect x="51" y="26" width="4" height="10" rx="2" fill="#e9d5ff"/>
  <!-- neck/body hint -->
  <rect x="22" y="48" width="20" height="8" rx="3" fill="#f5f3ff"/>
</svg>
