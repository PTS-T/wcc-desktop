resolver 127.0.0.11 valid=10s ipv6=off;
map $request_uri $desktop_uri {
    ~^/mawcc(?<wcc_desktop_uri>/desktop/.*)$ $wcc_desktop_uri;
    default $request_uri;
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8080;
    server_name _;
    return 308 https://$host:${HTTPS_PORT}$request_uri;
}
server {
    listen 8443 ssl;
    absolute_redirect off;
    set $auth_backend auth:3000;
    set $desktop_backend desktop:3000;
    server_name _;
    ssl_certificate /etc/wcc/tls/server.crt;
    ssl_certificate_key /etc/wcc/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ {
        proxy_pass http://$auth_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /_auth {
        internal;
        proxy_pass http://$auth_backend/api/whoami;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /_auth-desktop {
        internal;
        proxy_pass http://$auth_backend/api/desktop-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /_auth-admin {
        internal;
        proxy_pass http://$auth_backend/api/admin-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /mawcc/desktop { return 302 /mawcc/desktop/wcc/; }
    location /mawcc/desktop/ {
        auth_request /_auth-desktop;
        error_page 401 = @login;
        proxy_pass http://$desktop_backend$desktop_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location = /mawcc/config.html { return 302 /desktop-config.html; }
    location = /menu_config.js {
        alias /data/menu_config.js;
        add_header Cache-Control no-store;
    }
    location ~ ^/(config-box|admin-view)\.html$ {
        auth_request /_auth-admin;
        error_page 401 = @login;
        try_files $uri =404;
    }
    location ~ ^/(index\.html|login\.html|sign_up\.html|public-home\.html|favicon\.svg|brand_favicon\.js)$ {
        try_files $uri =404;
    }
    location = /login.html { try_files /index.html =404; }
    location = / { try_files /index.html =404; }
    location / {
        auth_request /_auth;
        error_page 401 = @login;
        try_files $uri =404;
    }
    location @login { return 302 /login.html; }
}
